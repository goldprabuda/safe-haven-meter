name: Safe-haven meter

on:
  schedule:
    - cron: '7,37 * * * 1-5'   # every 30 min, Mon-Fri (UTC). Off the hour: top-of-hour runs get delayed.
    - cron: '17 */6 * * 0,6'   # every 6 h at weekends
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh

permissions:
  contents: write              # to commit docs/data and data/ back to the repo

concurrency:
  group: safe-haven-meter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Score factors, write dashboard data, send alerts
        run: node src/run.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}             # optional but recommended (free)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # optional
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}     # optional
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}                 # optional
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}              # optional, added to alerts

      - name: Commit updated data
        run: |
          git config user.name "safe-haven-meter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: meter update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
